<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Last-Mile Delivery Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <div class="brand">🚚 Last-Mile Tracker</div>
  <nav id="nav"></nav>
</header>

<main>
<section id="landing" class="hero">
  <div>
    <h1>Smart delivery management</h1>
    <p>Rate calculation, intelligent agent assignment and real-time tracking.</p>
    <button onclick="show('login')">Login</button>
    <button class="secondary" onclick="show('register')">Register</button>
  </div>
</section>

<section id="login" class="card hidden">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="loginMsg"></p>
</section>

<section id="register" class="card hidden">
  <h2>Customer Registration</h2>
  <input id="regName" placeholder="Name">
  <input id="regEmail" placeholder="Email">
  <input id="regPhone" placeholder="Phone">
  <input id="regPassword" type="password" placeholder="Password">
  <button onclick="register()">Create account</button>
  <p id="regMsg"></p>
</section>

<section id="app" class="hidden">
  <div class="tabs">
    <button onclick="loadDashboard()">Dashboard</button>
    <button id="createTab" onclick="showPanel('createPanel')">Create Order</button>
    <button onclick="showPanel('trackPanel')">Track Order</button>
    <button id="adminTab" class="hidden" onclick="showPanel('adminPanel')">Admin</button>
    <button id="agentTab" class="hidden" onclick="showPanel('agentPanel')">Agent</button>
    <button onclick="logout()">Logout</button>
  </div>

  <div id="dashboardPanel" class="panel">
    <h2>My Orders</h2><div id="orders"></div>
  </div>

  <div id="createPanel" class="panel hidden">
    <h2>Create Delivery Order</h2>
    <div class="grid">
      <input id="pickup" placeholder="Pickup address e.g. Benz Circle, Vijayawada">
      <input id="drop" placeholder="Drop address e.g. Guntur">
      <input id="length" type="number" placeholder="Length (cm)">
      <input id="width" type="number" placeholder="Width (cm)">
      <input id="height" type="number" placeholder="Height (cm)">
      <input id="weight" type="number" step="0.01" placeholder="Actual weight (kg)">
      <select id="orderType"><option>B2C</option><option>B2B</option></select>
      <select id="payment"><option>PREPAID</option><option>COD</option></select>
    </div>
    <button onclick="getQuote()">Calculate Charge</button>
    <div id="quote"></div>
    <button id="confirmOrder" class="hidden" onclick="createOrder()">Confirm Order</button>
  </div>

  <div id="trackPanel" class="panel hidden">
    <h2>Track Order</h2>
    <input id="trackId" type="number" placeholder="Order ID">
    <button onclick="track()">Track</button>
    <div id="tracking"></div>
  </div>

  <div id="adminPanel" class="panel hidden">
    <h2>Admin Console</h2>
    <button onclick="loadAdminOrders()">Refresh Orders</button>
    <button onclick="loadAgents()">Agents</button>
    <button onclick="loadZones()">Zones</button>
    <button onclick="loadRates()">Rates</button>
    <div id="adminContent"></div>
  </div>

  <div id="agentPanel" class="panel hidden">
    <h2>Agent Console</h2>
    <label><input type="checkbox" id="available" checked onchange="setAvailability()"> Available</label>
    <div id="agentOrders"></div>
  </div>
</section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
